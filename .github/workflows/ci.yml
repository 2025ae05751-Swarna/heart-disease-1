name: MLOps

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
      - Swarna

  pull_request:
    branches:
      - main
      - master
      - Swarna

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff Lint
        run: ruff check src tests download_data.py

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Tests
        run: pytest -q

  train:
    name: Train Model
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Download Dataset
        run: python download_data.py

      - name: Run EDA
        run: python -m src.eda

      - name: Train Model
        run: python -m src.train

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlops-artifacts
          path: |
            artifacts/
            data/processed/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: train

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t heart-disease:latest .